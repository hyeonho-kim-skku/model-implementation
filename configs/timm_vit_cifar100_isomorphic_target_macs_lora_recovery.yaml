# Keep the same CIFAR-100 LoRA recovery recipe as the joint baseline.  Only the
# artifact path differs, so recovery accuracy is comparable at matched MACs.
model: timm_pruned_lora
artifact_path: ./pruned/vit_base_cifar100_lora50_isomorphic_target_macs/pruned_timm_classifier.pth
method: supervised
dataset: cifar100
mode: supervised
num_epochs: 20
batch_size: 64
optimizer: AdamW
lr: 0.0005
momentum: 0.9
weight_decay: 0.05
scheduler: CosineAnnealingLR
warmup_epochs: 0
num_classes: 100
lora_rank: 4
lora_alpha:
lora_modules: qkv,proj,mlp
qkv_lora_components: q,k,v

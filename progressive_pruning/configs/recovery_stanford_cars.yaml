# LoRA recovery for progressive pruning Stanford Cars artifacts.
model: timm_pruned_lora
artifact_path: null
reset_classifier: true
method: supervised
dataset: stanford_cars
mode: supervised
num_epochs: 20
batch_size: 64
optimizer: AdamW
lr: 0.0005
momentum: 0.9
weight_decay: 0.05
scheduler: CosineAnnealingLR
warmup_epochs: 0
num_classes: 196
lora_rank: 4
lora_alpha:
lora_modules: qkv,proj,mlp
qkv_lora_components: q,k,v
